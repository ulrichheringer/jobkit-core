[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jobkit-core"
version = "0.1.0"
description = "Small durable background jobs with PostgreSQL and Redis leases"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["croniter>=6,<7"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
redis = ["redis>=5,<8"]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.12", "mypy>=1.15", "types-croniter", "build", "psycopg[binary]>=3.2,<4", "redis>=5,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/jobkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
